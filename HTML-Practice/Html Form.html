<!doctype html>
<html lang="en">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Form</title>
    <body>
        <h1>Job Application Form</h1>
        <form>
            <label>Full Name: </label> 
            <input type="text" name="name" placeholder="Enter your name" required><br>
            <label>Email: </label>
            <input type="email" name="email" placeholder="Enter your email" required><br> 

            <label>Phone Number:</label> 
            <input type="tel" name="phone" placeholder="Enter your phone number" required><br>
            <label>Country</label> 
            <input type="text" name="country" placeholder="Enter your country" required><br>
            <label>Pragramming Language</label><br>
            <input type="checkbox" name="language" value="HTML"> HTML<br>
            <input type="checkbox" name="language" value="CSS"> CSS<br>
            <input type="checkbox" name="language" value="JavaScript"> JavaScript<br>
            <label>Experience Level:</label><br>
            <input type="radio" name="experience" value="beginner"> Beginner<br>
            <input type="radio" name="experience" value="intermediate"> Intermediate<br>
            <input type="radio" name="experience" value="advanced"> Advanced<br>
            <label>Tell us about yourself:</label><br>
            <textarea name="about" placeholder="Enter a brief description about yourself"></textarea><br>
        </form>
<button type="submit">Submit</button>
    </body>
</html>
