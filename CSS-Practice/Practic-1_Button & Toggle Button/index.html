<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Practice Projects</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <Section class="start" id="start">

            <div class="button-box">
                <button type="button" class="btn">Start Coding!</button>
          </div>

        </Section>

        <Section class="toggle" id="toggle">

            <div class="toggle-wrap">

                <label for="toggle">
                    <input type="checkbox" id="toggle" class="toggle-input"></label>
                    <div class="toggle-switch"></div>
                </label>

          </div>

        </Section>


    </body>
    
</html>
