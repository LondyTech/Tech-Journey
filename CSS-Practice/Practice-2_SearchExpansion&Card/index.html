<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=dedive-width, initial scale=1.0">
        <title>CSS Styling</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    </head>
    
    <body>
        <header class="search" id="search">
                <div class="search-box">
                    <label class="hide">Search</label>
                    <input type="search" placeholder="search..." class="search">
                </div>
        </header>

        <section class="screen" id="screen">

            <div class="screen-box">
                <div class="screen-p">
                    <img src="image.jpeg" alt="profile-picture">
                </div>
                
                <div class="subs">

                    <div class="icon-p">
                        <img src="image.jpeg" alt="icon-picture">
                    </div>

                    <div class="icon-info">
                      <h3>Abstract Gradient Project</h3>
                      <p>Scrimsbee McSrcimslee</p>
                    </div>

                </div>
        
                  <ul class="card-stats">
                  <li><i class="fa fa-bars" id="menu-icon"></i> 8</li>
                  <li><i class="fa fa-bars" id="menu-icon"></i> 32</li>
                 </ul>
            
            </div>

        </section>

        <section class="card" id="card">

            <div class="card-container">

                <div class="card-p">
                    <img src="image.jpeg" alt="profile-picture">
                </div>
                
                <div class="card-info">
                    <h2>Scrimton Scrimsby</h2>
                    <h3>scrimsallday3000</h3>
                    <p>I'm the world's most prolific Fortran dev.</p>
                    <button type="button" class="btn">Edit Profile</button>
                </div>
            
            </div>

        </section>






    </body>






</html>
